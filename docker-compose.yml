version: '3.8'

services:
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: eaglenav-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: >
      sh -c "npm install && npm start"
    depends_on:
      - backend

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: eaglenav-backend
    ports:
      - "5000:5000"
    volumes:
      - ./src/backend:/app
      - /app/node_modules
    environment:
      - MONGO_URI=mongodb://database:27017/eaglenav
      - PORT=5000
    command: >
      sh -c "npm install && npm run dev"
    depends_on:
      - database

  database:
    image: mongo:latest
    container_name: eaglenav-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
