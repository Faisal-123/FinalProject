version: '3'

services:
  frontend:
    image: node:18
    container_name: eaglenav-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app
    working_dir: /app
    command: npm start

  backend:
    image: node:18
    container_name: eaglenav-backend
    ports:
      - "5000:5000"
    volumes:
      - ./src:/app
    working_dir: /app
    command: node server.js

  database:
    image: mongo
    container_name: eaglenav-db
    ports:
      - "27017:27017"
